<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" style="background-color: #ffffff;">
  <defs>
    <!-- Left Crescent Gradient: Dark forest green at top, vibrant lime/spring green at bottom -->
    <linearGradient id="leftCrescentGrad600" x1="50%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#0a632b" />
      <stop offset="50%" stop-color="#188c38" />
      <stop offset="100%" stop-color="#70c427" />
    </linearGradient>

    <!-- Right Crescent Gradient: Lime/spring green at bottom, rich green at top -->
    <linearGradient id="rightCrescentGrad600" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70c427" />
      <stop offset="60%" stop-color="#28a53e" />
      <stop offset="100%" stop-color="#0e6b2e" />
    </linearGradient>

    <!-- Central Script Navy Gradient -->
    <linearGradient id="scriptNavyGrad600" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#072b64" />
      <stop offset="50%" stop-color="#0a397e" />
      <stop offset="100%" stop-color="#145cb8" />
    </linearGradient>

    <!-- Piercing Line Navy Gradient -->
    <linearGradient id="piercingLineGrad600" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#062657" />
      <stop offset="100%" stop-color="#0d4799" />
    </linearGradient>
  </defs>

  <!-- SOLID WHITE BACKGROUND (Exact 1:1 Square) -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- ======================================================== -->
  <!-- 1. CIRCULAR FRAME: TWO DISCONNECTED CRESCENT SHAPES      -->
  <!-- ======================================================== -->

  <!-- Left Crescent: Arches from bottom-left to top-center -->
  <path
    d="M 288 62
       C 246 68, 202 96, 170 138
       C 132 188, 130 252, 160 300
       C 178 330, 206 354, 238 368
       C 220 360, 190 336, 172 304
       C 148 260, 150 204, 182 162
       C 208 128, 248 102, 290 94
       C 292 84, 291 72, 288 62 Z"
    fill="url(#leftCrescentGrad600)"
  />

  <!-- Right Crescent: Arches from bottom-center to middle-right -->
  <path
    d="M 264 380
       C 320 382, 376 354, 412 314
       C 434 290, 444 264, 446 260
       C 440 268, 420 314, 368 350
       C 324 380, 274 380, 252 378
       C 256 379, 260 380, 264 380 Z"
    fill="url(#rightCrescentGrad600)"
  />

  <!-- ======================================================== -->
  <!-- 2. CENTRAL ARABIC CALLIGRAPHY SCRIPT ("الإسراج")         -->
  <!-- ======================================================== -->

  <!-- Left seen/alif loop with inner diamond cutout -->
  <path
    d="M 148 312
       L 224 254
       C 234 246, 244 236, 254 224
       C 266 206, 270 186, 262 170
       C 254 154, 242 146, 228 148
       C 216 150, 202 160, 194 176
       C 180 202, 168 238, 148 312 Z
       M 218 206
       C 226 192, 232 178, 236 172
       C 238 168, 234 166, 230 168
       C 224 172, 214 184, 208 198
       C 205 204, 211 210, 218 206 Z"
    fill="url(#scriptNavyGrad600)"
  />

  <!-- Calligraphic Nuqta (Diamond dot) -->
  <polygon points="226,226 238,214 227,202 215,214" fill="url(#scriptNavyGrad600)" />

  <!-- Lower Left Base Stroke below diagonal piercing line -->
  <path
    d="M 168 336
       L 238 280
       C 246 298, 258 324, 264 350
       C 248 340, 232 328, 218 322
       C 202 316, 184 324, 168 336 Z"
    fill="url(#scriptNavyGrad600)"
  />

  <!-- Tall Central Flame Alif (Peaks at 296, 36) -->
  <path
    d="M 278 268
       C 282 230, 284 190, 274 152
       C 266 122, 252 94, 240 74
       C 248 71, 258 70, 270 76
       C 288 88, 304 114, 316 148
       C 330 188, 334 236, 328 282
       C 322 246, 316 196, 302 160
       C 292 132, 280 110, 274 92
       C 282 110, 296 142, 304 180
       C 312 216, 310 252, 300 286
       L 278 268 Z"
    fill="url(#scriptNavyGrad600)"
  />

  <!-- Apex Needle Spire of Central Flame -->
  <path
    d="M 296 36
       C 288 62, 274 104, 260 150
       C 248 186, 238 220, 232 248
       C 240 222, 254 182, 270 142
       C 284 106, 298 70, 302 44
       C 302 40, 299 35, 296 36 Z"
    fill="url(#scriptNavyGrad600)"
  />

  <!-- Secondary Flame Hook (Reaches up to 358, 90) -->
  <path
    d="M 354 90
       C 346 108, 336 138, 328 168
       C 320 192, 316 214, 314 234
       C 322 214, 332 188, 344 160
       C 356 130, 368 104, 364 94
       C 362 88, 357 87, 354 90 Z"
    fill="url(#scriptNavyGrad600)"
  />

  <!-- Lower Script Flourish Crossing Under Diagonal Piercing Line -->
  <path
    d="M 280 328
       C 308 292, 340 250, 368 202
       C 362 228, 350 262, 334 294
       C 316 328, 294 356, 270 380
       C 276 364, 280 346, 280 328 Z"
    fill="url(#scriptNavyGrad600)"
  />

  <!-- Sweeping Bottom-Right Tail -->
  <path
    d="M 354 258
       C 378 288, 400 328, 406 368
       C 394 354, 376 334, 358 316
       C 336 294, 320 288, 306 290
       C 326 282, 344 272, 354 258 Z"
    fill="url(#scriptNavyGrad600)"
  />
  <path
    d="M 412 222
       C 416 264, 402 312, 372 350
       C 396 314, 410 270, 408 228
       C 409 225, 411 223, 412 222 Z"
    fill="url(#scriptNavyGrad600)"
  />

  <!-- ======================================================== -->
  <!-- 3. AVIATION MOTIF: DIAGONAL PIERCING LINE & GOLD PLANE   -->
  <!-- ======================================================== -->

  <!-- Thick straight blue line diagonally pierces through center -->
  <polygon
    points="138,400 162,400 432,142 432,118"
    fill="url(#piercingLineGrad600)"
  />

  <!-- Solid gold/mustard-yellow silhouette of a commercial airplane at top-right tip -->
  <g transform="translate(448, 102) rotate(-38.5)">
    <!-- Aerodynamic Commercial Fuselage -->
    <path
      d="M 0 -40
         C 5 -40, 9 -28, 9 14
         C 9 28, 5 38, 0 38
         C -5 38, -9 28, -9 14
         C -9 -28, -5 -40, 0 -40 Z"
      fill="#c89214"
    />
    <!-- Swept Wings -->
    <polygon
      points="0,-7 46,13 43,20 0,6 -43,20 -46,13"
      fill="#c89214"
    />
    <!-- Horizontal Tail Stabilizers -->
    <polygon
      points="0,24 20,33 17,38 0,30 -17,38 -20,33"
      fill="#c89214"
    />
  </g>

  <!-- ======================================================== -->
  <!-- 4. TYPOGRAPHY AND FORMATTING (PERFECTLY CENTER-ALIGNED)  -->
  <!-- ======================================================== -->

  <!-- Line 1 (Primary Brand): AL-ISRAJ in large, heavy, bold, uppercase sans-serif solid navy blue -->
  <text
    x="300"
    y="446"
    text-anchor="middle"
    font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="54"
    letter-spacing="3"
    fill="#09377d"
  >
    AL-ISRAJ
  </text>

  <!-- Line 2 (Secondary Brand): INTERNATIONAL in medium-sized, bold, uppercase sans-serif solid gold/mustard yellow matching the airplane -->
  <text
    x="300"
    y="494"
    text-anchor="middle"
    font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="800"
    font-size="30"
    letter-spacing="9"
    fill="#c89214"
  >
    INTERNATIONAL
  </text>

  <!-- Line 3 (Corporate Entity): TRAVELS (PVT.) LTD. in smaller, bold, uppercase sans-serif solid navy blue -->
  <text
    x="300"
    y="538"
    text-anchor="middle"
    font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="800"
    font-size="24"
    letter-spacing="4"
    fill="#09377d"
  >
    TRAVELS (PVT.) LTD.
  </text>
</svg>
